name: validate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 06:00 UTC — surfaces bit-rot in the CI itself even without changes.
    - cron: "0 6 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (canonicalization, signing, schema)
        run: node --test cli/test/*.test.js

      - name: Inbox relay unit tests (PoW, ported validators, transport)
        run: node --test inbox/worker/test/*.test.js

      - name: Bundled CLI schemas match spec (no drift)
        run: |
          for f in spec/schema/nrs-0.1.schema.json spec/schema/nrs-verification-0.1.schema.json; do
            diff -u "$f" "cli/schema/$(basename "$f")" \
              || { echo "cli/schema/$(basename "$f") drifted from $f"; exit 1; }
          done
          echo "Bundled CLI schemas are in lockstep with spec/schema/."

      - name: Validate all records (schema + hash + signature + supersedes)
        run: node registry/scripts/validate-all.js

      - name: Enforce add-only registry (immutable; one NRS-TS-0.1 tombstone carve-out)
        if: github.event_name == 'pull_request'
        run: node registry/scripts/check-add-only.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Enforce checkpoint immutability (numbered add-only; latest tracks head)
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Numbered checkpoints (checkpoints/<n>.json) may only be added.
          CHANGED=$(git diff --name-status "$BASE" "$HEAD" -- checkpoints/)
          VIOLATIONS=$(echo "$CHANGED" | awk '$2 ~ /^checkpoints\/[0-9]+\.json$/ && $1 != "A" { print }')
          if [ -n "$VIOLATIONS" ]; then
            echo "Numbered checkpoints are immutable (add-only):"
            echo "$VIOLATIONS"
            exit 1
          fi
          # latest.json, when present, must byte-equal the highest-numbered checkpoint.
          if [ -f checkpoints/latest.json ]; then
            HIGH=$(ls checkpoints 2>/dev/null | grep -E '^[0-9]+\.json$' | sort -n | tail -1)
            if [ -z "$HIGH" ]; then
              echo "checkpoints/latest.json is present but there is no numbered checkpoint."
              exit 1
            fi
            if ! diff -u "checkpoints/$HIGH" checkpoints/latest.json; then
              echo "checkpoints/latest.json must match the highest-numbered checkpoint ($HIGH)."
              exit 1
            fi
          fi
          echo "Checkpoint immutability check passed."

      - name: Build index (must succeed on every change)
        run: node registry/scripts/build-index.js /tmp/registry-index.json

      - name: Verify the checkpoint chain (no-op until the first checkpoint exists)
        run: node registry/scripts/verify-checkpoint.js
